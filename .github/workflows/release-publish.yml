name: Publish release

# Tags main and creates the GitHub Release whenever the version in
# manifest.json changes to one that has no tag yet.

on:
  push:
    branches:
      - main
    paths:
      - custom_components/moonraker/manifest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Tag and create GitHub Release
    if: ${{ !github.event.repository.fork && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Read version
        id: version
        run: |
          version="$(python3 scripts/release_version.py current)"
          const_version="$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' custom_components/moonraker/const.py)"
          if [ "$version" != "$const_version" ]; then
            echo "::error::manifest.json (${version}) and const.py (${const_version}) disagree."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${version}" > /dev/null; then
            echo "Tag ${version} already exists, nothing to publish." >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          if python3 scripts/release_version.py is-prerelease "$version"; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=(--generate-notes --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          else
            # Notes for a stable release cover everything since the last stable one, betas included.
            last_stable="$(git ls-remote --tags --refs origin | sed 's#.*refs/tags/##' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            if [ -n "$last_stable" ]; then
              flags+=(--notes-start-tag "$last_stable")
            fi
          fi
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/${VERSION}"
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --title "$VERSION" "${flags[@]}"
          echo "Published ${VERSION} (prerelease: ${PRERELEASE})" >> "$GITHUB_STEP_SUMMARY"
