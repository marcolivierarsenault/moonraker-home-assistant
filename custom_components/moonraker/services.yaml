send_gcode:
  name: "Send G-code"
  description: "Send a custom G-code command to the printer"
  fields:
    device_id:
      name: "Printer"
      description: "Moonraker device that should receive the G-code"
      required: true
      selector:
        device:
          integration: moonraker
    gcode:
      name: "G-code"
      description: "G-code command to send to the printer"
      required: true
      example: "G28"
      selector:
        text:
    wait:
      name: "Wait"
      description: "Wait for the G-code to finish. Turn off for long commands: the action then only waits a few seconds, to catch an immediate rejection, and later errors go to the Home Assistant log."
      default: true
      selector:
        boolean:
